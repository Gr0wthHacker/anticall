; ARI user for CallShield. The password comes from .env (CALLSHIELD_ASTERISK_ARI_PASSWORD).
; On bare metal prefer password_format=crypt with a crypt(3) hash.
[general]
enabled=yes
pretty=no
; ARI is not meant to be called from browsers; leave this empty.
allowed_origins=

[callshield]
type=user
read_only=no
password=${CALLSHIELD_ASTERISK_ARI_PASSWORD}
password_format=plain
