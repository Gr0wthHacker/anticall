; ARI rides on Asterisk's built-in HTTP server. It speaks plain HTTP and controls live calls.
;
;   BARE METAL / HOST NETWORK : bindaddr=127.0.0.1
;   DOCKER COMPOSE            : the entrypoint renders bindaddr=0.0.0.0 INSIDE the container
;                               (ASTERISK_HTTP_BIND), and compose publishes the port on
;                               127.0.0.1 only. Never publish 8088 on a public interface.
; For any access beyond the host, terminate TLS in front (reverse proxy / VPN).
[general]
enabled=yes
bindaddr=${ASTERISK_HTTP_BIND}
bindport=8088
; TLS (optional, only if you do not use a proxy):
;tlsenable=yes
;tlsbindaddr=127.0.0.1:8089
;tlscertfile=/etc/asterisk/keys/asterisk.pem
;tlsprivatekey=/etc/asterisk/keys/asterisk.key
