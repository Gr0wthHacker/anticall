; Minimal module set. Unlisted modules are autoloaded; these are excluded to keep the
; attack surface small. Adjust if your distribution names differ.
[modules]
autoload=yes
; Legacy SIP stack - we use PJSIP only.
noload => chan_sip.so
; Not needed for screening or callbacks.
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
; REQUIRED for CallShield (check with `module show like ari` etc. if calls misbehave):
;   res_ari.so res_ari_channels.so res_ari_bridges.so res_ari_applications.so
;   res_ari_endpoints.so res_http_websocket.so res_stasis.so res_pjsip.so
;   chan_pjsip.so res_rtp_asterisk.so chan_rtp.so (externalMedia)
;   res_stir_shaken.so + res_pjsip_stir_shaken.so (attestation verification)
