; R0 test harness dialplan - SAMPLE ONLY.
; Fictional numbers only:
;   5550100  mock IVR entry ("Example Lending", a fictional business)
;   5550101  mock IVR "sales" queue stub
;   5550102  user-owned test softphone (protected line endpoint)
;   5550103  mock human agent stub
; Nothing here dials out to any real number. There is no Dial() to an external trunk.
; Prompt files live under /var/lib/asterisk/sounds/en/callshield/ (generate synthetic audio yourself):
;   ivr-menu          "Press 1 for sales. Press 2 to speak with an agent."
;   agent-greeting    scripted agent greeting
;   removal-ack       "Your removal request has been received."
;   sales-stub        "Sales line. This is a test."
; If a prompt file is missing, Asterisk logs a warning and the dialplan continues.

[general]
static=yes
writeprotect=no

; --- Calls arriving from the simulated provider ---------------------------------
[test-inbound]
; Mock IVR on a user-owned test extension (R0 acceptance: reach agent via option 2)
exten => 5550100,1,NoOp(R0 mock IVR entry)
 same => n,Answer()
 same => n,Set(TIMEOUT(response)=6)
 same => n,Set(IVR_TRIES=0)
 same => n(menu),Background(callshield/ivr-menu)
 same => n,WaitExten(6)

exten => 1,1,NoOp(IVR option 1 = sales)
 same => n,Playback(callshield/sales-stub)
 same => n,Hangup()

exten => 2,1,NoOp(IVR option 2 = agent)
 same => n,Goto(mock-agent,s,1)

exten => i,1,NoOp(invalid IVR input)
 same => n,Set(IVR_TRIES=$[${IVR_TRIES}+1])
 same => n,GotoIf($[${IVR_TRIES}>=2]?bye)
 same => n,Goto(test-inbound,5550100,menu)
 same => n(bye),Hangup()

exten => t,1,NoOp(IVR timeout)
 same => n,Hangup()

; Inbound test: protected-line screening via ARI. The Stasis app drives the call;
; CallShield decides. If the ARI app is unreachable, fall back to ringing the user.
exten => 5550102,1,NoOp(inbound test to protected line)
 same => n,Stasis(callshield,inbound,5550102)
 same => n,GotoIf($["${STASISSTATUS}"="FAILED"]?fallback:done)
 same => n(fallback),NoOp(ARI unavailable: safe fallback to ordinary routing)
 same => n,Dial(PJSIP/5550102,20)
 same => n(done),Hangup()

; --- Mock agent: scripted greeting + removal acknowledgment ---------------------
[mock-agent]
exten => s,1,NoOp(mock agent connected)
 same => n,Wait(1)
 same => n,Playback(callshield/agent-greeting)
 ; Real calls would have the counterparty speak a request here. Harness simply waits.
 same => n,Wait(4)
 same => n,NoOp(removal request received - scripted acknowledgment)
 same => n,Playback(callshield/removal-ack)
 same => n,Hangup()

; --- Calls from the user's softphone -------------------------------------------
[test-internal]
; Internal test dial to the mock IVR (user-owned test extension only)
exten => 5550100,1,Goto(test-inbound,5550100,1)
exten => 5550103,1,Goto(mock-agent,s,1)
; Anything else is rejected. No external dialing in the harness.
exten => _X.,1,NoOp(blocked: harness permits only 5550100 and 5550103)
 same => n,Playback(ss-noservice)
 same => n,Hangup()
