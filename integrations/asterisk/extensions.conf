; CallShield dialplan - provider neutral. ${VARS} in CAPS are rendered by the entrypoint;
; Asterisk's own ${EXTEN} etc. are left alone.
;
; Division of labour:
;   * The Stasis app "callshield" (the telephony runner) decides what happens to a call.
;   * It hands the call back here with ARI continue(): to "ring-user" or "voicemail".
;   * If the runner is down, STASISSTATUS=FAILED and the call rings the user directly.
;     A call is never dropped just because CallShield is not running.

[general]
static=yes
writeprotect=no

[globals]
; Default thing to ring when no dial string was set by CallShield. Edit for your setup.
USER_DIAL=PJSIP/user

; --- Calls arriving from the SIP trunk -------------------------------------------
[from-trunk]
exten => _X.,1,NoOp(inbound call to protected line)
 same => n,Set(CALLSHIELD_DIAL=)
 ; Arg 2 is the dialed number; CallShield matches it to a protected line.
 same => n,Stasis(callshield,inbound,${EXTEN})
 same => n,GotoIf($["${STASISSTATUS}"="FAILED"]?fallback)
 same => n,Hangup()
 same => n(fallback),NoOp(ARI unavailable: safe fallback rings the user)
 same => n,Goto(callshield-route,ring-user,1)

exten => _+X.,1,Goto(from-trunk,${EXTEN:1},1)

; --- Hand-off targets used by CallShield (continue) --------------------------------
[callshield-route]
; Ring the user. CALLSHIELD_DIAL is set by CallShield for "transfer" decisions.
exten => ring-user,1,NoOp(ring user)
 same => n,ExecIf($["${CALLSHIELD_DIAL}"=""]?Set(CALLSHIELD_DIAL=${USER_DIAL}))
 same => n,Dial(${CALLSHIELD_DIAL},25)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n,Goto(voicemail,1)
 same => n(done),Hangup()

; Voicemail: needs voicemail.conf and a mailbox, or replace with Playback()+Record().
exten => voicemail,1,NoOp(voicemail)
 same => n,Answer()
 same => n,Wait(1)
 same => n,VoiceMail(100@default,su)
 same => n,Hangup()

exten => h,1,NoOp(hangup)

; --- Calls from your own phone (dial-out through the trunk is NOT enabled here) ------
[from-user]
; CallShield places callbacks itself through ARI; the user's phone gets no trunk access.
exten => _X.,1,NoOp(blocked: no dial-out from the user endpoint in this template)
 same => n,Playback(ss-noservice)
 same => n,Hangup()
