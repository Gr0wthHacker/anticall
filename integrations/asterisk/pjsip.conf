; R0 test harness - SAMPLE ONLY. Fictional numbers (555-01xx). Replace every CHANGE_ME.
; Do NOT connect a real SIP trunk to this sample. Do NOT expose SIP to the internet.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Simulated provider (sends test calls INTO the harness) -------------------
[provider-sim]
type=endpoint
transport=transport-udp
context=test-inbound
disallow=all
allow=ulaw
allow=alaw
aors=provider-sim
direct_media=no
rtp_symmetric=yes
force_rport=yes

[provider-sim]
type=aor
contact=sip:provider-sim@127.0.0.1:5070

[provider-sim]
type=identify
endpoint=provider-sim
match=127.0.0.1

; --- User-owned test softphone (extension 5550102) -----------------------------
[5550102]
type=endpoint
transport=transport-udp
context=test-internal
disallow=all
allow=ulaw
allow=alaw
auth=5550102-auth
aors=5550102
direct_media=no
rtp_symmetric=yes
force_rport=yes

[5550102-auth]
type=auth
auth_type=userpass
username=5550102
password=CHANGE_ME_softphone_password

[5550102]
type=aor
max_contacts=1
remove_existing=yes
