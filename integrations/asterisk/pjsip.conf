; CallShield generic PJSIP template - works with ANY SIP trunk.
; Values in ${...} are filled from the container environment by the entrypoint
; (infra/docker/asterisk-entrypoint.sh). On a bare-metal install, replace them by hand.
; Nothing here is provider specific. Verify every value against your provider's own
; documentation. This file has not been tested against a live trunk.
;
; Variables (put them in .env, never in this file):
;   TRUNK_HOST       provider SIP host or IP, e.g. sip.example-carrier.test
;   TRUNK_PORT       usually 5060 (UDP/TCP) or 5061 (TLS)
;   TRUNK_TRANSPORT  transport-udp | transport-tcp
;   TRUNK_USERNAME / TRUNK_PASSWORD   only for registration/digest auth trunks
;   TRUNK_CODECS     e.g. ulaw (G.711 u-law is the safe default)
;   USER_ENDPOINT_PASSWORD            password for your own softphone endpoint
;   EXTERNAL_IP      your public IP, only when behind NAT
;
; Pick ONE auth style below: (A) registration, or (B) IP-based identify. Delete the other.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Behind NAT, uncomment and set. Wrong values cause one-way audio.
;external_media_address=${EXTERNAL_IP}
;external_signaling_address=${EXTERNAL_IP}
;local_net=192.168.0.0/16

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ----------------------------------------------------------------------------
; The trunk. The endpoint NAME ("trunk") must match CALLSHIELD_ASTERISK_TRUNK_ENDPOINT.
; Inbound calls arrive in [from-trunk]; the dialed number becomes ${EXTEN}.
; ----------------------------------------------------------------------------
[trunk]
type=endpoint
transport=${TRUNK_TRANSPORT}
context=from-trunk
disallow=all
allow=${TRUNK_CODECS}
aors=trunk
outbound_auth=trunk-auth
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
send_pai=yes
trust_id_inbound=yes
; Ask Asterisk to verify STIR/SHAKEN on inbound calls (needs res_stir_shaken configured,
; see docs/deployment/asterisk.md). Without verification CallShield treats attestation as
; MISSING and blocks callbacks, by design. A forged Identity header is never trusted.
stir_shaken=verify
;stir_shaken=attest  ; outbound signing: only if your provider and certificates allow it

[trunk]
type=aor
contact=sip:${TRUNK_HOST}:${TRUNK_PORT}
qualify_frequency=60

[trunk-auth]
type=auth
auth_type=userpass
username=${TRUNK_USERNAME}
password=${TRUNK_PASSWORD}

; (A) Registration trunk: you register to the provider.
[trunk-reg]
type=registration
transport=${TRUNK_TRANSPORT}
outbound_auth=trunk-auth
server_uri=sip:${TRUNK_HOST}:${TRUNK_PORT}
client_uri=sip:${TRUNK_USERNAME}@${TRUNK_HOST}:${TRUNK_PORT}
retry_interval=60
expiration=3600

; (B) IP-authenticated trunk: the provider sends from fixed addresses. Use this INSTEAD of
; [trunk-reg] and drop [trunk-auth] / outbound_auth. List ALL provider source ranges.
;[trunk-identify]
;type=identify
;endpoint=trunk
;match=${TRUNK_HOST}

; ----------------------------------------------------------------------------
; Your own softphone / desk phone (what "ring the user" rings). Optional: you can also
; forward to a mobile number through the trunk via CALLSHIELD_ASTERISK_USER_DIAL_FORMAT.
; ----------------------------------------------------------------------------
[user]
type=endpoint
transport=transport-udp
context=from-user
disallow=all
allow=ulaw
auth=user-auth
aors=user
direct_media=no
rtp_symmetric=yes
force_rport=yes

[user]
type=aor
max_contacts=2

[user-auth]
type=auth
auth_type=userpass
username=user
password=${USER_ENDPOINT_PASSWORD}
