global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: callshield-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: callshield-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
