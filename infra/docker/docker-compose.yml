# Run from repo root:
#   docker compose -f infra/docker/docker-compose.yml --env-file .env up --build
# Synthetic/local mode only. All ports bind to 127.0.0.1. No secrets inline: see env.example.
name: callshield

x-app-env: &app-env
  env_file:
    - ../../.env

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    <<: *app-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evidence:/var/lib/callshield/evidence
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    <<: *app-env
    # Assumes callshield.worker module. Adjust when the worker lands.
    command: ["python", "-m", "callshield.worker"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evidence:/var/lib/callshield/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import callshield"]
      interval: 60s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/dashboard.Dockerfile
    restart: unless-stopped
    <<: *app-env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  asterisk:
    profiles: ["asterisk"]
    build:
      context: ../..
      dockerfile: infra/docker/asterisk.Dockerfile
    restart: unless-stopped
    # Secrets (ARI password, trunk credentials) come from .env only: see env.example.
    <<: *app-env
    ports:
      # Everything binds to 127.0.0.1. A real trunk needs SIP/RTP reachable from the provider:
      # see docs/deployment/asterisk.md before changing these (and firewall them).
      - "127.0.0.1:5060:5060/udp"
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:10000-10100:10000-10100/udp"
    healthcheck:
      test: ["CMD", "/usr/local/bin/asterisk-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Long-running telephony process: ARI events -> Defend pipeline -> call control.
  telephony:
    profiles: ["asterisk"]
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      args:
        EXTRAS: "postgres,asterisk"  # add ",voice" for local STT/TTS (large download)
    restart: unless-stopped
    <<: *app-env
    command: ["python", "-m", "callshield.telephony.asterisk"]
    environment:
      CALLSHIELD_ASTERISK_ENABLED: "true"
      CALLSHIELD_ASTERISK_ARI_URL: "http://asterisk:8088"
      # Asterisk sends RTP to this name:port; we bind inside the container network only.
      CALLSHIELD_ASTERISK_EXTERNAL_MEDIA_HOST: "telephony"
      CALLSHIELD_ASTERISK_EXTERNAL_MEDIA_BIND: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      asterisk:
        condition: service_healthy
    volumes:
      - evidence:/var/lib/callshield/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8089/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  evidence:
