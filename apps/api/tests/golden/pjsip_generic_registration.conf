; CallShield trunk: profile=generic_sip auth=registration
; Generated by `callshield init`. Contains secrets: keep this file private (0600).
; UNVERIFIED TEMPLATE: provider-specific values below are defaults, not facts. Confirm every value against the provider's current documentation.
; Attestation source (UNVERIFIED): unknown; outbound A attestation: unknown
; Inbound DID is read from: request_uri

[transport-callshield]
type=transport
protocol=udp
bind=127.0.0.1:5060
external_media_address=203.0.113.10
external_signaling_address=203.0.113.10
; Bind 0.0.0.0 only when the provider must reach you AND a firewall limits it.

[mytrunk-auth]
type=auth
auth_type=userpass
username=acct123
password=test-password-not-real

[mytrunk-reg]
type=registration
transport=transport-callshield
outbound_auth=mytrunk-auth
server_uri=sip:sip.example.test:5060
client_uri=sip:acct123@sip.example.test:5060
retry_interval=60
expiration=3600

[mytrunk]
type=endpoint
transport=transport-callshield
context=from-trunk
disallow=all
allow=ulaw,alaw
aors=mytrunk
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
outbound_auth=mytrunk-auth

[mytrunk]
type=aor
contact=sip:sip.example.test:5060

[mytrunk]
type=identify
endpoint=mytrunk
match=sip.example.test
