[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callshield"
version = "0.1.0"
description = "CallShield Network backend (modular monolith)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]
postgres = ["psycopg[binary]>=3.1"]
asterisk = ["aiohttp>=3.9"]
voice = ["numpy>=1.26", "onnxruntime>=1.17", "faster-whisper>=1.0", "vosk>=0.3.45", "piper-tts>=1.2"]
all = ["callshield[postgres,asterisk,voice]"]

[project.scripts]
callshield = "callshield.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "T20", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["callshield", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
