name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest

  # hashFiles() is unavailable in job-level `if`, so the guard is on each step
  # after checkout. The job is a no-op until apps/dashboard exists.
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            apps/dashboard
      - name: Detect dashboard
        id: detect
        working-directory: .
        run: |
          if [ -f apps/dashboard/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "apps/dashboard not present; skipping"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npm run lint
      - if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.detect.outputs.present == 'true'
        run: npm run build

  policy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Policy guard
        run: python scripts/policy_guard.py
      - name: Policy guard unit tests
        run: |
          pip install pytest
          pytest tests/unit/test_policy_guard.py

  # Real Postgres: migrations, RLS policies and the ledger append-only trigger.
  # SQLite-backed pytest cannot exercise any of these.
  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: callshield
          POSTGRES_PASSWORD: callshield_ci
          POSTGRES_DB: callshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callshield -d callshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CALLSHIELD_DB_URL: postgresql+psycopg://callshield:callshield_ci@localhost:5432/callshield
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        working-directory: apps/api
        run: pip install -e ".[dev,postgres]"
      - name: Alembic upgrade head
        working-directory: apps/api
        run: alembic upgrade head
      - name: Verify RLS and ledger immutability
        run: python scripts/verify_postgres_rls.py
      - name: Alembic downgrade and re-upgrade (round trip)
        working-directory: apps/api
        run: |
          alembic downgrade base
          alembic upgrade head
