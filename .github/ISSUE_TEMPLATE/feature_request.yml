name: Feature request
description: Propose a feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Features that add dial capability, LLM tools, bulk or repeated calling, spoofing, or weaken safety gates will be closed. See the non-goals in README.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [Defend, Resolve, Enforce, Community, Infra, Docs]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This does not add dial capability, bulk calling, spoofing, or loosen a gate
          required: true
