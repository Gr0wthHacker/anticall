name: Bug report
description: Something is broken in the synthetic/local prototype
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real phone numbers, recordings, transcripts, or credentials. Use fictional 555-01xx numbers.
        Security vulnerabilities: do not file here. Use a private security advisory (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This report contains no real phone numbers, personal data, or secrets
          required: true
